services:
  mc:
    image: itzg/minecraft-server
    environment:
      EULA: "true"
      ENABLE_ROLLING_LOGS: "true"
      TZ: "America/Chicago"
      OVERRIDE_SERVER_PROPERTIES: "true"
      DIFFICULTY: "easy"
      MAX_TICK_TIME: "-1"
      ALLOW_FLIGHT: "true"
      OPS: ""
      VIEW_DISTANCE: 32
      MAX_PLAYERS: 4
      PVP: "true"
      LEVEL_TYPE: "biomesoplenty"
      MOTD: "I missed the part where that's my problem."
    ports:
      - "25565:25565"
    volumes:
      - data:/data
    stdin_open: true
    tty: true
    restart: unless-stopped
volumes:
  data: {}