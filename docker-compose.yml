# create chaos!
services:
  mc:
    image: itzg/minecraft-server
    container_name: "chaos"
    stdin_open: true
    tty: true
    ports:
      - "25565:25565"
    volumes:
      - data:/data
      - ./mods.txt:/data/mods.txt:ro
      - ./datapacks.txt:/data/datapacks.txt:ro
      - ./packs/WASD-Libraries-V7.6.0.zip:/data/WASD-Libraries-V7.6.0.zip
    environment:
      EULA: "true"
      MEMORY: "24G"
      MOTD: "MrJohnson's Survival Challenge"
      PVP: "true"
      DIFFICULTY: "hard"
      VERSION: 1.21.1
      TYPE: "FABRIC"
      # MOD_PLATFORM: "modrinth"
      MODS_FILE: "mods.txt"
      DATAPACKS_FILE: "datapacks.txt"
      REMOVE_OLD_DATAPACKS: "true"
      RCON_CMDS_FIRST_CONNECT:  |-
        gamerule keepInventory true
        scoreboard players set #CL_Time ClearLag 120
        scoreboard players set rain_interval unusual-precipitation-config 123
        gamerule healthOnSpawn 3
        gamerule maxHealth 40
        gamerule levelsPerHeart 5
        scoreboard objectives add deaths deathCount
        scoreboard objectives setdisplay list deaths
    restart: unless-stopped
volumes:
  data: {}