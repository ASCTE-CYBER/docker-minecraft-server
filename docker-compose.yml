# minecraft club FALL 2026!
services:
  mc:
    image: itzg/minecraft-server
    container_name: mcclub
    stdin_open: true
    tty: true
    ports:
      - "25565:25565"
      - "25575:25575"
    volumes:
      - club:/data
      - ./mods.txt:/data/mods.txt:ro
      - ./datapacks.txt:/data/datapacks.txt:ro
    environment:
      EULA: "true"
      MEMORY: "24G"
      ENABLE_ROLLING_LOGS: "true"
      TZ: "America/Chicago"
      MOTD: "May the odds be ever in your favour..."
      PVP: "true"
      DIFFICULTY: "normal"
      VERSION: "26.3"
      JAVA_VERSION: "25"
      TYPE: "PAPER"
      # MOD_PLATFORM: "modrinth"
      MODS_FILE: "mods.txt"
      DATAPACKS_FILE: "datapacks.txt"
      REMOVE_OLD_DATAPACKS: "true"
      SPAWN_PROTECTION: "0"
      MAX_PLAYERS: "30"
      MAX_ENTITY_CRAMMING: "128"
      SIMULATION_DISTANCE: "6"
      VIEW_DISTANCE: "10"
      RCON_CMDS_FIRST_CONNECT:  |-
        scoreboard objectives add deaths deathCount
        scoreboard objectives setdisplay list deaths
        gamerule disable_end true
        gamerule disable_nether false
        gamerule disable_gateway false
      RCON_PASSWORD: nabruh
      SNOOPER_ENABLED: "false"
    restart: unless-stopped
volumes:
  club: {}

