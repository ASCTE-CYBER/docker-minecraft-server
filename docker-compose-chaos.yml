services:
  mc:
    image: itzg/minecraft-server
    container_name: "chaos"
    environment:
      EULA: "true"
    ports:
      - "25565:25565"
    # volumes:
    #   - data:/data
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      VERSION: 1.21.1
      EULA: "true"
      MEMORY: "16G"
      MOTD: "good luck"
      TYPE: "FABRIC"
      PVP: "true"
      DIFFICULTY: "hard"
      MODS_FILE: "modfile.txt"
# volumes:
#   data: {}