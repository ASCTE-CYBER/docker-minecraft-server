services:
  mc:
    image: itzg/minecraft-server
    container_name: "chaos"
    environment:
      EULA: "true"
    ports:
      - "25565:25565"
    volumes:
      - data:/data
      - ./modfile.txt:/data/modfile.txt:ro
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      EULA: "true"
      MEMORY: "16G"
      MOTD: "good luck"
      PVP: "true"
      DIFFICULTY: "hard"
      VERSION: 1.21.1
      TYPE: "FABRIC"
      # MOD_PLATFORM: "modrinth"
      MODS_FILE: "mods.txt"
      DATAPACKS_FILE: datapacks.txt
volumes:
  data: {}