services:
  mc:
    image: itzg/minecraft-server
    container_name: "chaos"
    stdin_open: true
    tty: true
    ports:
      - "25565:25565"
    volumes:
      - data:/data
      - ./mods.txt:/data/mods.txt:ro
      - ./datapacks.txt:/data/datapacks.txt:ro
    environment:
      EULA: "true"
      MEMORY: "16G"
      MOTD: "good luck"
      PVP: "true"
      DIFFICULTY: "hard"
      VERSION: 1.21.1
      TYPE: "FABRIC"
      # MOD_PLATFORM: "modrinth"
      MODS_FILE: "mods.txt"
      DATAPACKS_FILE: "datapacks.txt"
      REMOVE_OLD_DATAPACKS: "true"
    restart: unless-stopped
volumes:
  data: {}